name: CI

on:
  push:
    branches: [dev, staging, master]
  pull_request:
    branches: [dev, staging, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Primary matrix: all three supported Node versions on Linux.
        os: [ubuntu-latest]
        node: [18, 20, 22]
        # Cross-OS spot-check: Node 20 on Windows and macOS.
        include:
          - os: windows-latest
            node: 20
          - os: macos-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Test (vitest)
        run: npm test

      - name: Lint (eslint)
        run: npm run lint
